openapi: 3.1.0
info:
  title: RailFlux API
  version: 1.0.0
  description: |
    Synthetic railway booking contract shared by baseline and optimized deployment profiles.

    **Frozen for implementation (M1).** Baseline monolith and optimized read/booking services MUST expose
    the same paths, methods, and response semantics. Displayed availability is always advisory
    (`freshness.authoritative` is false).

    Breaking changes after v1.0.0 require an ADR and a new major API version. Additive optional
    fields and new enum values are allowed in minor revisions only before the principal experiment
    freeze recorded in the run manifest.
  license:
    name: Unlicensed
    url: https://github.com/mitra9917/RailFlux
servers:
  - url: /api
    description: Local and behind ALB (path prefix)
  - url: https://example.invalid/api
    description: Placeholder production URL in docs only
tags:
  - name: search
    description: Train discovery (read path)
  - name: availability
    description: Advisory seat display (read path)
  - name: bookings
    description: Authoritative booking mutations and status (write path)
  - name: health
    description: Process probes (unauthenticated)
paths:
  /v1/search:
    get:
      tags: [search]
      operationId: searchTrains
      summary: List train runs for a route and date
      security: [{syntheticJwt: []}]
      parameters:
        - $ref: "#/components/parameters/RunIdHeader"
        - name: from
          in: query
          required: true
          schema: {type: string, pattern: "^[A-Z]{2,5}$"}
        - name: to
          in: query
          required: true
          schema: {type: string, pattern: "^[A-Z]{2,5}$"}
        - name: date
          in: query
          required: true
          schema: {type: string, format: date}
      responses:
        "200":
          description: Matching train runs
          content:
            application/json:
              schema:
                type: object
                required: [items, freshness]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/TrainRun"}
                  freshness: {$ref: "#/components/schemas/Freshness"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
  /v1/availability:
    get:
      tags: [availability]
      operationId: getAvailability
      summary: Advisory displayed availability for a train run
      security: [{syntheticJwt: []}]
      parameters:
        - $ref: "#/components/parameters/RunIdHeader"
        - name: trainRunId
          in: query
          required: true
          schema: {type: string, format: uuid}
        - name: class
          in: query
          required: true
          schema: {$ref: "#/components/schemas/TravelClass"}
        - name: quota
          in: query
          required: true
          schema: {$ref: "#/components/schemas/Quota"}
      responses:
        "200":
          description: Advisory displayed availability (may be served from cache on optimized profile)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Availability"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404":
          description: Unknown train run or inventory bucket
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
  /v1/bookings:
    post:
      tags: [bookings]
      operationId: createBooking
      summary: Create or replay a booking with idempotency
      security: [{syntheticJwt: []}]
      parameters:
        - $ref: "#/components/parameters/RunIdHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateBooking"}
      responses:
        "200":
          description: Idempotent replay of an existing terminal result
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BookingResult"}
        "201":
          description: New booking reached a terminal or in-progress state for this attempt
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BookingResult"}
        "400": {$ref: "#/components/responses/BadRequest"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "409":
          description: Sold out, idempotency conflict, or business rule conflict
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
        "422":
          description: Payment or business-rule failure (terminal FAILED booking may be included)
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BookingResult"}
        "425":
          description: Identical idempotent request still processing; poll GET booking or retry with backoff
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BookingInProgress"}
        "429":
          description: Admission limit reached
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
  /v1/bookings/{bookingId}:
    get:
      tags: [bookings]
      operationId: getBooking
      summary: Booking status for reconciliation after client timeout
      security: [{syntheticJwt: []}]
      parameters:
        - $ref: "#/components/parameters/RunIdHeader"
        - name: bookingId
          in: path
          required: true
          schema: {type: string, format: uuid}
      responses:
        "200":
          description: Terminal or in-progress booking state
          content:
            application/json:
              schema: {$ref: "#/components/schemas/BookingResult"}
        "401": {$ref: "#/components/responses/Unauthorized"}
        "404":
          description: Booking not found
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ErrorResponse"}
  /health/live:
    get:
      tags: [health]
      operationId: liveness
      summary: Liveness probe
      responses:
        "200":
          description: Process is alive
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HealthStatus"}
  /health/ready:
    get:
      tags: [health]
      operationId: readiness
      summary: Readiness probe
      responses:
        "200":
          description: Required dependencies are ready
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HealthStatus"}
        "503":
          description: Not ready
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HealthStatus"}
components:
  securitySchemes:
    syntheticJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Locally issued synthetic identity token; never a real IRCTC credential.
  parameters:
    RunIdHeader:
      name: X-Run-Id
      in: header
      required: false
      description: Experiment run identifier for logs and metrics correlation (optional outside measured runs).
      schema: {type: string, minLength: 8, maxLength: 64, pattern: "^[a-zA-Z0-9_-]+$"}
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 16, maxLength: 128}
  responses:
    BadRequest:
      description: Invalid input
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema: {$ref: "#/components/schemas/ErrorResponse"}
  schemas:
    TravelClass:
      type: string
      enum: [SL, 3A, 2A]
    Quota:
      type: string
      enum: [TATKAL]
    TrainRun:
      type: object
      required: [trainRunId, trainNo, name, date, from, to]
      properties:
        trainRunId: {type: string, format: uuid}
        trainNo: {type: string, pattern: "^[0-9]{5}$"}
        name: {type: string, maxLength: 120}
        date: {type: string, format: date}
        from: {type: string, pattern: "^[A-Z]{2,5}$"}
        to: {type: string, pattern: "^[A-Z]{2,5}$"}
    Freshness:
      type: object
      required: [observedAt, authoritative, cacheStatus]
      properties:
        observedAt: {type: string, format: date-time}
        authoritative:
          type: boolean
          const: false
          description: Displayed availability and search summaries are never authoritative for allocation.
        cacheStatus:
          type: string
          enum: [HIT, MISS, BYPASS]
          description: BYPASS indicates baseline or cache-disabled read path.
    Availability:
      type: object
      required: [trainRunId, class, quota, displayedSeats, freshness]
      properties:
        trainRunId: {type: string, format: uuid}
        class: {$ref: "#/components/schemas/TravelClass"}
        quota: {$ref: "#/components/schemas/Quota"}
        displayedSeats: {type: integer, minimum: 0}
        freshness: {$ref: "#/components/schemas/Freshness"}
    Passenger:
      type: object
      required: [syntheticName, age]
      properties:
        syntheticName: {type: string, maxLength: 80}
        age: {type: integer, minimum: 1, maximum: 120}
    CreateBooking:
      type: object
      required: [userId, inventoryId, passengers, paymentToken]
      properties:
        userId: {type: string, format: uuid}
        inventoryId: {type: string, format: uuid}
        passengers:
          type: array
          minItems: 1
          maxItems: 4
          items: {$ref: "#/components/schemas/Passenger"}
        paymentToken:
          type: string
          minLength: 8
          maxLength: 128
          description: Synthetic token only; never a real payment instrument.
    BookingStatus:
      type: string
      enum: [RECEIVED, PAYMENT_PENDING, CONFIRMED, SOLD_OUT, FAILED]
    BookingResult:
      type: object
      required: [bookingId, status]
      properties:
        bookingId: {type: string, format: uuid}
        simulatedPnr:
          type: [string, "null"]
          pattern: "^RF[0-9]{10}$"
        status: {$ref: "#/components/schemas/BookingStatus"}
        errorCode:
          type: [string, "null"]
          enum:
            - null
            - SOLD_OUT
            - IDEMPOTENCY_CONFLICT
            - PAYMENT_FAILED
            - VALIDATION_ERROR
            - ADMISSION_LIMITED
    BookingInProgress:
      type: object
      required: [bookingId, status, retryAfterMs]
      properties:
        bookingId: {type: string, format: uuid}
        status:
          type: string
          enum: [RECEIVED, PAYMENT_PENDING]
        retryAfterMs: {type: integer, minimum: 100, maximum: 5000}
    ErrorResponse:
      type: object
      required: [errorCode, message]
      properties:
        errorCode:
          type: string
          enum:
            - VALIDATION_ERROR
            - UNAUTHORIZED
            - NOT_FOUND
            - IDEMPOTENCY_CONFLICT
            - SOLD_OUT
            - ADMISSION_LIMITED
            - INTERNAL_ERROR
        message: {type: string, maxLength: 256}
    HealthStatus:
      type: object
      required: [status]
      properties:
        status: {type: string, enum: [ok, degraded, fail]}
