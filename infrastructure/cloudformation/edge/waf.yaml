AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  RailFlux CloudFront WAF (M5 #47). Deploy in us-east-1 for ST-001–ST-003 cells.
  Associate this Web ACL with the CloudFront distribution origin to the ALB.

Parameters:
  SessionName:
    Type: String
    MinLength: 1
    MaxLength: 32
    AllowedPattern: "^[a-z0-9][a-z0-9-]*$"
  RunId:
    Type: String
    Default: ""
  Owner:
    Type: String
    Default: railflux
  ExpiresAt:
    Type: String
    Description: ISO8601 session teardown deadline (tag)
  RateLimitPerFiveMinutes:
    Type: Number
    Default: 2000
    Description: Aggregate IP rate limit (ST-002 concentration hook).

Metadata:
  RailFlux:
    Profile: aws-edge-waf
    Scope: CLOUDFRONT
    ApplicationRegion: ap-south-1
    LayoutVersion: m5-issue-47
    SecurityTests:
      ST-001: AWSManagedRulesCommonRuleSet
      ST-002: RateBasedRule
      ST-003: Tune rate / exclusions in manifest for false positives

Resources:
  CloudFrontWebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub railflux-${SessionName}-cf-waf
      Scope: CLOUDFRONT
      DefaultAction:
        Allow: {}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub railflux-${SessionName}-cf-waf
      Rules:
        - Name: AWSManagedRulesCommonRuleSet
          Priority: 0
          OverrideAction:
            None: {}
          Statement:
            ManagedRuleGroupStatement:
              VendorName: AWS
              Name: AWSManagedRulesCommonRuleSet
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub railflux-${SessionName}-common
        - Name: RateLimitPerIp
          Priority: 1
          Action:
            Block: {}
          Statement:
            RateBasedStatement:
              Limit: !Ref RateLimitPerFiveMinutes
              AggregateKeyType: IP
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: !Sub railflux-${SessionName}-rate

Outputs:
  SessionName:
    Value: !Ref SessionName
  CloudFrontWebAclArn:
    Value: !GetAtt CloudFrontWebAcl.Arn
  EdgeRegion:
    Value: us-east-1
  WafLayoutVersion:
    Value: m5-issue-47
