AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Baseline profile uses shared/alb-ingress.yaml (M5 #47). Deploy via
  npm run aws:deploy:alb-baseline.

Metadata:
  RailFlux:
    Module: alb-ingress-alias
    CanonicalTemplate: ../shared/alb-ingress.yaml

Resources: {}

Outputs:
  Note:
    Value: Use shared/alb-ingress.yaml with IngressProfile=aws-baseline
