AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  RailFlux aws-baseline ECS Fargate monolith (M5 #46). ALB ingress is
  shared/alb-ingress.yaml (M5 #47).

Parameters:
  SessionName:
    Type: String
    MinLength: 1
    MaxLength: 32
    AllowedPattern: "^[a-z0-9][a-z0-9-]*$"
  PublicSubnetIds:
    Type: CommaDelimitedList
  TargetGroupArn:
    Type: String
    Description: Target group from alb-ingress stack.
  EcsSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  EcsTaskExecutionRoleArn:
    Type: String
  EcsTaskRoleArn:
    Type: String
  ContainerImage:
    Type: String
    Description: ECR image URI for baseline monolith.
  DbEndpointAddress:
    Type: String
  DbName:
    Type: String
    Default: railflux
  DbMasterSecretArn:
    Type: String
  SyntheticJwtSecret:
    Type: String
    NoEcho: true
  AppPort:
    Type: Number
    Default: 3000
  TaskCpu:
    Type: String
    Default: "512"
    AllowedValues: ["256", "512", "1024", "2048"]
  TaskMemory:
    Type: String
    Default: "1024"
  DesiredCount:
    Type: Number
    Default: 1
    MinValue: 1
    MaxValue: 4

Metadata:
  RailFlux:
    Module: ecs-monolith
    Profile: aws-baseline
    LayoutVersion: m5-issue-47
    ResourceParity:
      request_serving_vcpu: 0.5
      request_serving_memory_gib: 1

Resources:
  EcsCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub railflux-${SessionName}-baseline
      Tags:
        - Key: Name
          Value: !Sub railflux-${SessionName}-baseline

  MonolithLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /railflux/${SessionName}/monolith
      RetentionInDays: 7

  MonolithTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub railflux-${SessionName}-monolith
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !Ref EcsTaskExecutionRoleArn
      TaskRoleArn: !Ref EcsTaskRoleArn
      ContainerDefinitions:
        - Name: monolith
          Image: !Ref ContainerImage
          Essential: true
          PortMappings:
            - ContainerPort: !Ref AppPort
              Protocol: tcp
          Environment:
            - Name: NODE_ENV
              Value: production
            - Name: PORT
              Value: !Sub "${AppPort}"
            - Name: MYSQL_HOST
              Value: !Ref DbEndpointAddress
            - Name: MYSQL_PORT
              Value: "3306"
            - Name: MYSQL_DATABASE
              Value: !Ref DbName
            - Name: SYNTHETIC_JWT_SECRET
              Value: !Ref SyntheticJwtSecret
          Secrets:
            - Name: MYSQL_USER
              ValueFrom: !Sub "${DbMasterSecretArn}:username::"
            - Name: MYSQL_PASSWORD
              ValueFrom: !Sub "${DbMasterSecretArn}:password::"
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref MonolithLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: monolith
          HealthCheck:
            Command:
              - CMD-SHELL
              - !Sub >-
                node -e "fetch('http://127.0.0.1:${AppPort}/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 60

  MonolithService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub railflux-${SessionName}-monolith
      Cluster: !Ref EcsCluster
      LaunchType: FARGATE
      DesiredCount: !Ref DesiredCount
      TaskDefinition: !Ref MonolithTaskDefinition
      HealthCheckGracePeriodSeconds: 120
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED
          Subnets: !Ref PublicSubnetIds
          SecurityGroups:
            - !Ref EcsSecurityGroupId
      LoadBalancers:
        - ContainerName: monolith
          ContainerPort: !Ref AppPort
          TargetGroupArn: !Ref TargetGroupArn

Outputs:
  EcsClusterName:
    Value: !Ref EcsCluster
  TargetGroupArn:
    Value: !Ref TargetGroupArn
  TaskCpu:
    Value: !Ref TaskCpu
  TaskMemory:
    Value: !Ref TaskMemory
  ResourceParityBaseline:
    Description: JSON snippet for run manifest resource parity.
    Value: !Sub '{"profile":"aws-baseline","monolith":{"cpu_units":${TaskCpu},"memory_mib":${TaskMemory},"desired_count":${DesiredCount}}}'
