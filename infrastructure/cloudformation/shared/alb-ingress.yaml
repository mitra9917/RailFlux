AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  RailFlux ALB ingress — HTTPS, origin verification header, WAF cell hooks (M5 #47).
  Target group for ECS attachment; direct ALB access without header returns 403 (ST-004 prep).

Parameters:
  SessionName:
    Type: String
    MinLength: 1
    MaxLength: 32
    AllowedPattern: "^[a-z0-9][a-z0-9-]*$"
  IngressProfile:
    Type: String
    AllowedValues:
      - aws-baseline
      - aws-optimized
  TargetGroupSuffix:
    Type: String
    Default: app
    Description: Short suffix for target group (e.g. mono, edge).
  PublicSubnetIds:
    Type: CommaDelimitedList
  VpcId:
    Type: AWS::EC2::VPC::Id
  AlbSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
  AppPort:
    Type: Number
    Default: 3000
  AcmCertificateArn:
    Type: String
    Description: ACM certificate ARN in ap-south-1 for HTTPS listener.
  OriginVerifyHeaderName:
    Type: String
    Default: X-RailFlux-Origin-Verify
  OriginVerifyHeaderValue:
    Type: String
    NoEcho: true
  WafMode:
    Type: String
    Default: "off"
    AllowedValues:
      - "off"
      - "on"
  CloudFrontWebAclArn:
    Type: String
    Default: ""
    Description: Optional us-east-1 CloudFront WAF ACL ARN when WafMode is on (from edge stack).

Metadata:
  RailFlux:
    Module: alb-ingress
    LayoutVersion: m5-issue-47
    SecurityTests:
      ST-004: "Requests without origin header get 403 from ALB HTTPS listener"
      ST-001-ST-003: "Enable WafMode on; associate CloudFrontWebAclArn at distribution (edge stack)"

Resources:
  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Type: application
      Subnets: !Ref PublicSubnetIds
      SecurityGroups:
        - !Ref AlbSecurityGroupId
      Tags:
        - Key: Name
          Value: !Sub railflux-${SessionName}-alb
        - Key: WafMode
          Value: !Ref WafMode
        - Key: RailFluxIngressProfile
          Value: !Ref IngressProfile

  ApplicationTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Port: !Ref AppPort
      Protocol: HTTP
      VpcId: !Ref VpcId
      TargetType: ip
      HealthCheckEnabled: true
      HealthCheckPath: /health/ready
      HealthCheckProtocol: HTTP
      Matcher:
        HttpCode: "200"
      Tags:
        - Key: Name
          Value: !Sub railflux-${SessionName}-${TargetGroupSuffix}-tg

  HttpRedirectListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig:
            Protocol: HTTPS
            Port: "443"
            StatusCode: HTTP_301

  HttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref AcmCertificateArn
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig:
            StatusCode: "403"
            ContentType: text/plain
            MessageBody: Direct ALB access denied

  OriginVerifyForwardRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpsListener
      Priority: 10
      Conditions:
        - Field: http-header
          HttpHeaderConfig:
            HttpHeaderName: !Ref OriginVerifyHeaderName
            Values:
              - !Ref OriginVerifyHeaderValue
      Actions:
        - Type: forward
          TargetGroupArn: !Ref ApplicationTargetGroup

Outputs:
  AlbArn:
    Value: !Ref ApplicationLoadBalancer
  AlbDnsName:
    Value: !GetAtt ApplicationLoadBalancer.DNSName
  TargetGroupArn:
    Value: !Ref ApplicationTargetGroup
  HttpsListenerArn:
    Value: !Ref HttpsListener
  OriginVerifyHeaderName:
    Value: !Ref OriginVerifyHeaderName
  WafMode:
    Value: !Ref WafMode
  CloudFrontWebAclArn:
    Value: !Ref CloudFrontWebAclArn
  RunManifestWafMode:
    Description: Copy into experiment run manifest experiment.waf_mode.
    Value: !Ref WafMode
