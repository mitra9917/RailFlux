AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  RailFlux account cost guardrails — AWS Budgets notifications at $10/$25/$50/$75
  and Cost Anomaly Detection (M5 #51). Deploy once per account before paid sessions.

Parameters:
  BudgetAlertEmail:
    Type: String
    Description: Email address for budget and anomaly notifications (account owner).
    AllowedPattern: "^[^@]+@[^@]+\\.[^@]+$"
  MonthlyBudgetLimitUsd:
    Type: Number
    Default: 100
    Description: Monthly cost budget cap (USD); aligns with cost-plan stop-and-review at $100.

Metadata:
  RailFlux:
    Module: account-budgets
    LayoutVersion: m5-issue-51
    CostPlanThresholdsUsd: [10, 25, 50, 75]
    DeployRegion: us-east-1

Resources:
  RailFluxMonthlyCostBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: railflux-account-monthly
        BudgetLimit:
          Amount: !Ref MonthlyBudgetLimitUsd
          Unit: USD
        BudgetType: COST
        TimeUnit: MONTHLY
        CostTypes:
          IncludeCredit: true
          IncludeDiscount: true
          IncludeOtherSubscription: true
          IncludeRecurring: true
          IncludeRefund: true
          IncludeSubscription: true
          IncludeSupport: true
          IncludeTax: true
          IncludeUpfront: true
          UseBlended: false
      NotificationsWithSubscribers:
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: ACTUAL
            Threshold: 10
            ThresholdType: ABSOLUTE_VALUE
          Subscribers:
            - Address: !Ref BudgetAlertEmail
              SubscriptionType: EMAIL
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: ACTUAL
            Threshold: 25
            ThresholdType: ABSOLUTE_VALUE
          Subscribers:
            - Address: !Ref BudgetAlertEmail
              SubscriptionType: EMAIL
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: ACTUAL
            Threshold: 50
            ThresholdType: ABSOLUTE_VALUE
          Subscribers:
            - Address: !Ref BudgetAlertEmail
              SubscriptionType: EMAIL
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: ACTUAL
            Threshold: 75
            ThresholdType: ABSOLUTE_VALUE
          Subscribers:
            - Address: !Ref BudgetAlertEmail
              SubscriptionType: EMAIL

  RailFluxCostAnomalyMonitor:
    Type: AWS::CE::AnomalyMonitor
    Properties:
      MonitorName: railflux-service-anomaly
      MonitorType: DIMENSIONAL
      MonitorDimensionKey: SERVICE

  RailFluxCostAnomalySubscription:
    Type: AWS::CE::AnomalySubscription
    DependsOn: RailFluxCostAnomalyMonitor
    Properties:
      SubscriptionName: railflux-anomaly-email
      MonitorArnList:
        - !GetAtt RailFluxCostAnomalyMonitor.MonitorArn
      Subscribers:
        - Type: EMAIL
          Address: !Ref BudgetAlertEmail
          Status: ACTIVE
      Frequency: DAILY
      Threshold: 10

Outputs:
  BudgetName:
    Value: railflux-account-monthly
  BudgetAlertEmail:
    Value: !Ref BudgetAlertEmail
  AnomalyMonitorArn:
    Value: !GetAtt RailFluxCostAnomalyMonitor.MonitorArn
  ThresholdsUsd:
    Value: "10,25,50,75"
