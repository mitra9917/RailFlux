# Local MySQL for baseline dev (matches CI service env in .github/workflows/ci.yml).
services:
  mysql:
    image: mysql:8.0
    container_name: railflux-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: railflux
      MYSQL_USER: railflux
      MYSQL_PASSWORD: railflux
    ports:
      # Host 3307 avoids conflict with a local MySQL install on 3306 (common on macOS).
      - "3307:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 25s
    volumes:
      - railflux-mysql-data:/var/lib/mysql

  baseline:
    profiles: [baseline]
    build:
      context: ../..
      dockerfile: infrastructure/compose/Dockerfile.baseline
    container_name: railflux-baseline
    environment:
      NODE_ENV: development
      PORT: 3000
      SERVICE_PROFILE: baseline
      SYNTHETIC_JWT_SECRET: dev-only-change-me
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: railflux
      MYSQL_PASSWORD: railflux
      MYSQL_DATABASE: railflux
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health/ready').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 25s

volumes:
  railflux-mysql-data:
