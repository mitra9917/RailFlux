name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, test, and contract checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run CI checks
        run: npm run ci

      - name: Build Compose baseline profile images
        run: docker compose -f infrastructure/compose/docker-compose.yml --project-directory infrastructure/compose --profile baseline build

  database-smoke:
    name: MySQL migrate and fixture load
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_USER: railflux
      MYSQL_PASSWORD: railflux
      MYSQL_PWD: railflux
      MYSQL_DATABASE: railflux
      REDIS_URL: redis://127.0.0.1:6379
      SQS_ENDPOINT: http://127.0.0.1:9324
    services:
      elasticmq:
        image: softwaremill/elasticmq-native:latest
        ports:
          - 9324:9324
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: railflux
          MYSQL_USER: railflux
          MYSQL_PASSWORD: railflux
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y mysql-client

      - name: Load fixture (migrate, verify checksum, seed)
        run: ./database/scripts/load-fixture.sh

      - name: Assert seeded row counts
        run: |
          users="$(mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -u "$MYSQL_USER" -D "$MYSQL_DATABASE" -N -e 'SELECT COUNT(*) FROM users;')"
          inventory="$(mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -u "$MYSQL_USER" -D "$MYSQL_DATABASE" -N -e 'SELECT COUNT(*) FROM seat_inventory;')"
          test "$users" -eq 5000
          test "$inventory" -eq 300

      - name: Reset experiment state
        run: ./database/scripts/reset.sh

      - name: Assert reset cleared bookings
        run: |
          bookings="$(mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -u "$MYSQL_USER" -D "$MYSQL_DATABASE" -N -e 'SELECT COUNT(*) FROM bookings;')"
          test "$bookings" -eq 0

      - name: TC-001 integration (baseline search and availability)
        env:
          TC001_INTEGRATION: "1"
          SYNTHETIC_JWT_SECRET: ci-tc001-integration-secret
        run: npm run test:tc001

      - name: TC-001 read service (search + availability)
        env:
          READ_TC001_INTEGRATION: "1"
          SYNTHETIC_JWT_SECRET: ci-read-tc001-secret
        run: npm run test:read-tc001

      - name: TC-002 availability cache (read + Redis)
        env:
          TC002_INTEGRATION: "1"
          SYNTHETIC_JWT_SECRET: ci-tc002-cache-secret
        run: npm run test:tc002-cache

      - name: Edge routing (OpenAPI /v1 split)
        env:
          EDGE_ROUTING_INTEGRATION: "1"
          SYNTHETIC_JWT_SECRET: edge-routing-test-secret
        run: npm run test:edge-routing

      - name: Atomic inventory claim integration (TC-004)
        run: npm run test:claim-inventory

      - name: Idempotency replay integration (TC-005)
        run: npm run test:idempotency-replay

      - name: Idempotency conflict and in-flight (TC-006)
        run: npm run test:idempotency-conflict

      - name: Payment failure inventory release (TC-008)
        run: npm run test:payment-failure

      - name: Baseline booking outbox (M3 #25)
        run: npm run test:booking-outbox

      - name: Outbox publish to ElasticMQ (M4 #35)
        env:
          OUTBOX_SQS_INTEGRATION: "1"
        run: npm run test:outbox-sqs

      - name: TC-010 side-effect duplicate (worker dedupe)
        env:
          TC010_INTEGRATION: "1"
        run: npm run test:tc010

      - name: FT-004 poison message DLQ
        env:
          FT004_INTEGRATION: "1"
        run: npm run test:ft004-dlq

      - name: GET booking status after commit (TC-009)
        run: npm run test:get-booking

      - name: M3 booking create path TC-003/004/008/009
        run: npm run test:booking-create

      - name: Concurrent last-seat contention (TC-007)
        run: npm run test:tc007-contention

      - name: Post-run correctness SQL (M3 #27)
        env:
          RUN_ID: ci-correctness-smoke
        run: node database/scripts/run-correctness.mjs --run-id "$RUN_ID"
