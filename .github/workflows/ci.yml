name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, test, and contract checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run CI checks
        run: npm run ci

      - name: Build Compose baseline profile images
        run: docker compose -f infrastructure/compose/docker-compose.yml --project-directory infrastructure/compose --profile baseline build

  database-smoke:
    name: MySQL migrate and fixture load
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: 3306
      MYSQL_USER: railflux
      MYSQL_PASSWORD: railflux
      MYSQL_PWD: railflux
      MYSQL_DATABASE: railflux
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: railflux
          MYSQL_USER: railflux
          MYSQL_PASSWORD: railflux
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y mysql-client

      - name: Load fixture (migrate, verify checksum, seed)
        run: ./database/scripts/load-fixture.sh

      - name: Assert seeded row counts
        run: |
          users="$(mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -u "$MYSQL_USER" -D "$MYSQL_DATABASE" -N -e 'SELECT COUNT(*) FROM users;')"
          inventory="$(mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -u "$MYSQL_USER" -D "$MYSQL_DATABASE" -N -e 'SELECT COUNT(*) FROM seat_inventory;')"
          test "$users" -eq 5000
          test "$inventory" -eq 300

      - name: Reset experiment state
        run: ./database/scripts/reset.sh

      - name: Assert reset cleared bookings
        run: |
          bookings="$(mysql -h "$MYSQL_HOST" -P "$MYSQL_PORT" -u "$MYSQL_USER" -D "$MYSQL_DATABASE" -N -e 'SELECT COUNT(*) FROM bookings;')"
          test "$bookings" -eq 0

      - name: TC-001 integration (baseline search and availability)
        env:
          TC001_INTEGRATION: "1"
          SYNTHETIC_JWT_SECRET: ci-tc001-integration-secret
        run: npm run test:tc001

      - name: Atomic inventory claim integration (TC-004)
        run: npm run test:claim-inventory

      - name: Idempotency replay integration (TC-005)
        run: npm run test:idempotency-replay

      - name: Idempotency conflict and in-flight (TC-006)
        run: npm run test:idempotency-conflict

      - name: Payment failure inventory release (TC-008)
        run: npm run test:payment-failure

      - name: Baseline booking outbox (M3 #25)
        run: npm run test:booking-outbox

      - name: GET booking status after commit (TC-009)
        run: npm run test:get-booking
